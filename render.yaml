# Persistent SQLite requires a paid Render service with an attached disk.
# If you want 100% free deployment without credit card, change plan to 'free' and remove the 'disk' section.
services:
  - type: web
    name: vincent-art-taichinh
    runtime: node
    region: singapore
    plan: starter
    autoDeployTrigger: off
    buildCommand: npm run check
    startCommand: node src/server.js
    healthCheckPath: /healthz
    disk:
      name: vincent-art-sqlite
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24.22.0"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: VINCENT_DATA_DIR
        value: /var/data
      - key: ADMIN_EMAIL
        value: admin@vincent.local
      - key: ADMIN_PASSWORD
        value: Admin@Vincent2026!
      - key: AI_API_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: AI_API_KEY
        sync: false
