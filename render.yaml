# Persistent SQLite requires a paid Render service with an attached disk.
# Do not change to plan: free: its filesystem does not persist financial data.
services:
  - type: web
    name: vincent-art-taichinh
    runtime: node
    region: singapore
    plan: starter
    autoDeployTrigger: off
    buildCommand: npm run check
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: vincent-art-sqlite
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: VINCENT_DATA_DIR
        value: /var/data
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AI_API_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: AI_API_KEY
        sync: false
